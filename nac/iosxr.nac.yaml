# Cisco Network as Code data model for the lab's IOS-XR routers.
#
# Scope: this owns a labelled slice of the configuration, not the whole
# device. configs/<node>.cfg (day-0) still bootstraps each router to the
# point where automation can reach it -- management address, credentials,
# ssh, grpc -- and brings up the interfaces, IS-IS and iBGP that the lab is
# built on. Everything below is what Network as Code owns and reconciles.
#
# `host` is a 127.0.0.1 port because the routers' management ports live only
# on the OOB network; nac.sh tunnels those ports through nms. The provider
# speaks gNMI, which the routers enable with `grpc / port 57400 / no-tls`.
iosxr:
  devices:
    - name: xr1
      host: 127.0.0.1:57411
      configuration:
        # Already what day-0 set, so this converges to a no-op -- it makes
        # the model the source of truth for identity without changing
        # anything.
        hostname: xr1

        interfaces:
          loopbacks:
            - id: 98
              description: Managed by Network as Code
              ipv4:
                address: 10.98.1.1
                mask: 255.255.255.255

        # What a prefix from gobgp is allowed to look like on the wire.
        # `^65100$` is an AS path of exactly one hop, AS 65100: gobgp
        # originated it and nobody else has touched it. A prefix that arrives
        # having transited another AS, or claiming a different origin, does
        # not match -- which is the case this exists to catch, since an eBGP
        # peer can advertise any AS path it likes.
        routing_sets:
          - name: NAC-GOBGP-ASPATH
            type: as_path
            rpl: |
              as-path-set NAC-GOBGP-ASPATH
                ios-regex '^65100$'
              end-set

          # Exactly which prefixes gobgp is allowed to originate. The five
          # ranges together cover second octets 100-139 and nothing else,
          # which is precisely the block gobgp generates
          # (10.100.0.0/24 .. 10.139.15.0/24). `ge 24 le 24` pins the length
          # to /24, so a more-specific announcement inside the range -- the
          # usual shape of a hijack or a leak -- does not match either.
          #
          # This replaces an inline `destination in (...)` match that used
          # 10.96.0.0/11 and 10.128.0.0/12, and so quietly accepted second
          # octets 96-99 and 140-143 as well.
          - name: NAC-GOBGP-PREFIXES
            type: prefix
            rpl: |
              prefix-set NAC-GOBGP-PREFIXES
                10.100.0.0/14 ge 24 le 24,
                10.104.0.0/13 ge 24 le 24,
                10.112.0.0/12 ge 24 le 24,
                10.128.0.0/13 ge 24 le 24,
                10.136.0.0/14 ge 24 le 24
              end-set

        # Inbound policy for the external speaker. Day-0 applies a
        # permissive `PASS` in both directions purely so the eBGP session
        # accepts anything at all (IOS-XR applies no default policy to eBGP);
        # this replaces the inbound half with one that checks both halves of
        # what we expect: the prefix is in NAC-GOBGP-PREFIXES AND the AS path
        # is in NAC-GOBGP-ASPATH. Either one failing drops the prefix.
        # `rpl` is the *whole* policy, wrapper included -- the device stores
        # and returns it that way, and a bare body is rejected with
        # "There is a parse error in the policy." So the name is repeated
        # inside the text; keep the two in step.
        route_policies:
          - name: NAC-GOBGP-IN
            rpl: |
              route-policy NAC-GOBGP-IN
                if destination in NAC-GOBGP-PREFIXES and as-path in NAC-GOBGP-ASPATH then
                  pass
                else
                  drop
                endif
              end-policy
          - name: NAC-GOBGP-OUT
            rpl: |
              route-policy NAC-GOBGP-OUT
                pass
              end-policy

        routing:
          bgp:
            - as_number: 65000
              neighbors:
                - address: 10.2.1.2
                  address_family:
                    - name: ipv4-unicast
                      route_policy_in: NAC-GOBGP-IN
                      route_policy_out: NAC-GOBGP-OUT

    - name: xr2
      host: 127.0.0.1:57412
      configuration:
        hostname: xr2

        interfaces:
          loopbacks:
            - id: 98
              description: Managed by Network as Code
              ipv4:
                address: 10.98.2.1
                mask: 255.255.255.255

        # The same two expectations, enforced a second time. xr1 already
        # filters what it accepts from gobgp, so this is defence in depth
        # rather than the primary check: if xr1's inbound policy were removed
        # or mis-edited, xr2 would still refuse a prefix outside the expected
        # block or carrying an AS path it should never see over iBGP. Neither
        # the prefix nor the AS path is rewritten inside an AS, so both are
        # still checkable here.
        routing_sets:
          - name: NAC-GOBGP-ASPATH
            type: as_path
            rpl: |
              as-path-set NAC-GOBGP-ASPATH
                ios-regex '^65100$'
              end-set

          - name: NAC-GOBGP-PREFIXES
            type: prefix
            rpl: |
              prefix-set NAC-GOBGP-PREFIXES
                10.100.0.0/14 ge 24 le 24,
                10.104.0.0/13 ge 24 le 24,
                10.112.0.0/12 ge 24 le 24,
                10.128.0.0/13 ge 24 le 24,
                10.136.0.0/14 ge 24 le 24
              end-set

        route_policies:
          - name: NAC-IBGP-IN
            rpl: |
              route-policy NAC-IBGP-IN
                if destination in NAC-GOBGP-PREFIXES and as-path in NAC-GOBGP-ASPATH then
                  pass
                else
                  drop
                endif
              end-policy

        routing:
          bgp:
            - as_number: 65000
              neighbors:
                - address: 1.1.1.1
                  address_family:
                    - name: ipv4-unicast
                      route_policy_in: NAC-IBGP-IN

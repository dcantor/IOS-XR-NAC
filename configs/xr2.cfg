!! IOS-XRv9000 day-0 configuration for xr2
!! Applied automatically from a CD-ROM containing this file as
!! iosxr_config.txt. Also safe to paste into the console under 'configure'.
hostname xr2
username admin
 group root-lr
 group cisco-support
 secret 0 Admin@12345
!
line default
 exec-timeout 0 0
!
cdp
!
!! BFD needs a line card nominated to host multihop sessions, which is what
!! the iBGP session over the loopbacks is. Without this the session sits in
!! BFD_MP_DOWNLOAD_NO_LC and never comes up. 0/RP0/CPU0 is rejected outright
!! ("Location is not a valid MH node") -- it has to be the line card.
bfd
 multipath include location 0/0/CPU0
!
!! Loopback0 is this router's stable identity: advertised into OSPF (so the
!! peer reaches it over both links) and used as the iBGP peering address.
interface Loopback0
 ipv4 address 2.2.2.2 255.255.255.255
!
!! Management port on the out-of-band network, shared with nms and the other
!! router. There is no default route here: nms is on the same subnet, and
!! nothing on the router needs to reach anything further.
interface MgmtEth0/RP0/CPU0/0
 description OOB management network
 ipv4 address 10.99.0.12 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/0/0/0
 description link1 to xr1 Gi0/0/0/0
 ipv4 address 10.1.1.2 255.255.255.252
 cdp
 no shutdown
!
interface GigabitEthernet0/0/0/1
 description link2 to xr1 Gi0/0/0/1
 ipv4 address 10.1.2.2 255.255.255.252
 cdp
 no shutdown
!
!! Ship syslog to the management server over the OOB network. Sourcing from
!! the management port makes the messages arrive with this router's OOB
!! address, which is how rsyslog on nms files them per router.
logging trap informational
logging 10.99.0.10 vrf default severity info
logging source-interface MgmtEth0/RP0/CPU0/0
logging hostnameprefix xr2
!
!! OSPF is the IGP: area 0, both links as point-to-point, Loopback0 passive
!! so the /32 is advertised without running OSPF on it. Each router therefore
!! learns the peer's loopback over both links as an equal-cost pair.
!!
!! Neighbours must authenticate (MD5, key id 1) -- an unauthenticated or
!! wrong-key router cannot form an adjacency. The key is a lab value and is
!! stored encrypted by the device on commit.
!!
!! BFD gives sub-second failure detection on each link: 300 ms x 3 = 900 ms,
!! against OSPF's own dead interval of 40 s.
router ospf CORE
 router-id 2.2.2.2
 area 0
  interface Loopback0
   passive enable
  !
  interface GigabitEthernet0/0/0/0
   network point-to-point
   authentication message-digest
   message-digest-key 1 md5 clear Lab_OSPF_Key1
   bfd fast-detect
   bfd minimum-interval 300
   bfd multiplier 3
  !
  interface GigabitEthernet0/0/0/1
   network point-to-point
   authentication message-digest
   message-digest-key 1 md5 clear Lab_OSPF_Key1
   bfd fast-detect
   bfd minimum-interval 300
   bfd multiplier 3
  !
 !
!
!! iBGP between the two routers, peering loopback-to-loopback. The session
!! rides the OSPF-learned /32, so it survives either link failing. BFD here
!! is a multihop session between the two loopbacks (see the bfd block above).
router bgp 65000
 bgp router-id 2.2.2.2
 address-family ipv4 unicast
 !
 neighbor 1.1.1.1
  remote-as 65000
  description iBGP to xr1
  update-source Loopback0
  bfd fast-detect
  bfd minimum-interval 300
  bfd multiplier 3
  address-family ipv4 unicast
  !
 !
!
ssh server v2
ssh server vrf default
!
!! gNMI, so Cisco Network as Code (Terraform) can configure this router.
!! Plain gRPC without TLS: the lab has no PKI, and the provider is told to
!! match with IOSXR_TLS=false.
grpc
 port 57400
 no-tls
 address-family ipv4
!
end

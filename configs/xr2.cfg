!! IOS-XRv9000 day-0 configuration for xr2
!! Applied automatically from a CD-ROM containing this file as
!! iosxr_config.txt. Also safe to paste into the console under 'configure'.
hostname xr2
username admin
 group root-lr
 group cisco-support
 secret 0 Admin@12345
!
line default
 exec-timeout 0 0
!
cdp
!
!! Loopback0 is this router's stable identity: advertised into IS-IS (so the
!! peer reaches it over both links) and used as the iBGP peering address.
interface Loopback0
 ipv4 address 2.2.2.2 255.255.255.255
!
!! Management port on the out-of-band network, shared with nms and the other
!! router. There is no default route here: nms is on the same subnet, and
!! nothing on the router needs to reach anything further.
interface MgmtEth0/RP0/CPU0/0
 description OOB management network
 ipv4 address 10.99.0.12 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/0/0/0
 description link1 to xr1 Gi0/0/0/0
 ipv4 address 10.1.1.2 255.255.255.252
 cdp
 no shutdown
!
interface GigabitEthernet0/0/0/1
 description link2 to xr1 Gi0/0/0/1
 ipv4 address 10.1.2.2 255.255.255.252
 cdp
 no shutdown
!
!! Ship syslog to the management server over the OOB network. Sourcing from
!! the management port makes the messages arrive with this router's OOB
!! address, which is how rsyslog on nms files them per router.
logging trap informational
logging 10.99.0.10 vrf default severity info
logging source-interface MgmtEth0/RP0/CPU0/0
logging hostnameprefix xr2
!
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0002.00
 address-family ipv4 unicast
 !
 interface Loopback0
  passive
  address-family ipv4 unicast
  !
 !
 interface GigabitEthernet0/0/0/0
  point-to-point
  address-family ipv4 unicast
  !
 !
 interface GigabitEthernet0/0/0/1
  point-to-point
  address-family ipv4 unicast
  !
 !
!
!! iBGP between the two routers, peering loopback-to-loopback. The session
!! rides on the IS-IS-learned /32, so it survives either link failing.
router bgp 65000
 bgp router-id 2.2.2.2
 address-family ipv4 unicast
 !
 neighbor 1.1.1.1
  remote-as 65000
  description iBGP to xr1
  update-source Loopback0
  address-family ipv4 unicast
  !
 !
!
ssh server v2
ssh server vrf default
!
!! gNMI, so Cisco Network as Code (Terraform) can configure this router.
!! Plain gRPC without TLS: the lab has no PKI, and the provider is told to
!! match with IOSXR_TLS=false. See nac/README-ish notes in README.md.
grpc
 port 57400
 no-tls
 address-family ipv4
!
end
